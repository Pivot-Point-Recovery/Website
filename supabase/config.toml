# All three functions are called by parties with no Supabase session -- an
# anonymous browser visitor, or Stripe's servers. verify_jwt must be false or
# the platform rejects them with 401 before our code ever runs.
#
# These endpoints are public by design and defend themselves: an origin
# allowlist and honeypot on the browser-facing ones, and on the webhook a
# signature check plus an authoritative re-fetch of every object from Stripe.

[functions.public-forms]
verify_jwt = false

[functions.donations-checkout]
verify_jwt = false

[functions.donations-webhook]
verify_jwt = false

# Called every 15 minutes by pg_cron, which holds no user session, and by
# finance from the Board Center. It authenticates both itself: the schedule's
# token against Vault, a person's session against has_role('finance').
[functions.donations-reconcile]
verify_jwt = false

# Called by the Apps Script on the intake Google Form, which has no Supabase
# JWT either. It authenticates with the INTAKE_WEBHOOK_SECRET shared secret
# and refuses every request while that secret is unset.
[functions.intake-webhook]
verify_jwt = false

# Meetings: transcription and Claude's draft of the minutes. Called only from
# the Board Center, but its ?health=1 check must answer without a session like
# every other function's. Every action authenticates the caller itself, against
# public.is_member() with the caller's own token.
[functions.meeting-minutes]
verify_jwt = false

# The Monday summary email. Called by pg_cron, which holds no user session, and
# by an administrator previewing it from the Board Center. It authenticates both
# itself: the scheduler's token against Vault, a person's session against
# has_role('admin').
[functions.board-digest]
verify_jwt = false
